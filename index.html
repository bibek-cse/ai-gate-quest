<div id="installbar" hidden><img src="icons/icon-192.png" alt=""><div><b>Add GATE Quest to your home screen</b><span id="installmsg">Open it like an app, in one tap.</span></div><button id="installbtn">Install</button><button id="installx" aria-label="Close">×</button></div>
<script>
(function () {
  if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  const bar = document.getElementById("installbar"), btn = document.getElementById("installbtn"), msg = document.getElementById("installmsg");
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  let dismissed = false; try { dismissed = localStorage.getItem("aigq.install") === "x"; } catch (e) {}
  if (standalone || dismissed) return;
  let deferred = null;
  addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; bar.hidden = false; });
  btn.onclick = async () => { if (deferred) { deferred.prompt(); await deferred.userChoice; deferred = null; bar.hidden = true; } };
  document.getElementById("installx").onclick = () => { bar.hidden = true; try { localStorage.setItem("aigq.install", "x"); } catch (e) {} };
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  if (ios) { msg.textContent = "Tap the Share button, then 'Add to Home Screen'."; btn.hidden = true; setTimeout(() => bar.hidden = false, 2500); }
  addEventListener("appinstalled", () => { bar.hidden = true; });
})();
</script>
